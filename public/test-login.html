<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Test Login - Wisata App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .test-section {
            margin-bottom: 30px;
        }
        
        .test-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        
        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge.success {
            background: #28a745;
            color: white;
        }
        
        .badge.error {
            background: #dc3545;
            color: white;
        }
        
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #2196f3;
            margin-bottom: 20px;
        }
        
        .info-box p {
            margin: 5px 0;
            color: #1565c0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Test Fitur Login</h1>
        
        <div class="info-box">
            <p><strong>🔐 Demo Accounts:</strong></p>
            <p>• Admin: admin@gmail.com / admin</p>
            <p>• User: user@gmail.com / user123</p>
        </div>
        
        <div class="test-section">
            <h2>
                <span>1️⃣</span>
                Test Login Admin
            </h2>
            <button onclick="testLogin('admin@gmail.com', 'admin', 'admin')">
                🔑 Login sebagai Admin
            </button>
            <div id="result-admin" class="result"></div>
        </div>
        
        <div class="test-section">
            <h2>
                <span>2️⃣</span>
                Test Login User
            </h2>
            <button onclick="testLogin('user@gmail.com', 'user123', 'user')">
                👤 Login sebagai User
            </button>
            <div id="result-user" class="result"></div>
        </div>
        
        <div class="test-section">
            <h2>
                <span>3️⃣</span>
                Test Throttling
            </h2>
            <button onclick="testThrottling()">
                🚦 Test Rate Limiting
            </button>
            <div id="result-throttle" class="result"></div>
        </div>
    </div>
    
    <script>
        async function testLogin(email, password, type) {
            const resultDiv = document.getElementById('result-' + type);
            resultDiv.innerHTML = '<p>Loading...</p>';
            resultDiv.className = 'result show';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                // Check for rate limit headers
                const rateLimit = response.headers.get('X-RateLimit-Limit');
                const rateRemaining = response.headers.get('X-RateLimit-Remaining');
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result show success';
                    resultDiv.innerHTML = `
                        <p><span class="badge success">✅ SUCCESS</span></p>
                        <p><strong>Status:</strong> ${response.status} OK</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Role:</strong> ${data.user.role}</p>
                        <p><strong>Token:</strong> ${data.access_token.substring(0, 50)}...</p>
                        ${rateLimit ? `<p><strong>Rate Limit:</strong> ${rateRemaining}/${rateLimit} remaining</p>` : ''}
                        <p><strong>Redirect to:</strong> ${data.user.role === 'admin' ? '/dashboard' : '/wisata'}</p>
                    `;
                } else {
                    resultDiv.className = 'result show error';
                    resultDiv.innerHTML = `
                        <p><span class="badge error">❌ FAILED</span></p>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `
                    <p><span class="badge error">❌ ERROR</span></p>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p>Pastikan server berjalan di http://127.0.0.1:8000</p>
                `;
            }
        }
        
        async function testThrottling() {
            const resultDiv = document.getElementById('result-throttle');
            resultDiv.innerHTML = '<p>Sending multiple requests...</p>';
            resultDiv.className = 'result show';
            
            let results = [];
            let throttled = false;
            
            for (let i = 1; i <= 10; i++) {
                try {
                    const response = await fetch('http://127.0.0.1:8000/api/wisata');
                    const rateLimit = response.headers.get('X-RateLimit-Limit');
                    const rateRemaining = response.headers.get('X-RateLimit-Remaining');
                    
                    if (response.status === 429) {
                        throttled = true;
                        const data = await response.json();
                        results.push(`Request #${i}: 🚫 THROTTLED - ${data.message}`);
                        break;
                    } else {
                        results.push(`Request #${i}: ✅ ${response.status} - ${rateRemaining}/${rateLimit} remaining`);
                    }
                } catch (error) {
                    results.push(`Request #${i}: ❌ Error - ${error.message}`);
                }
                
                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            if (throttled) {
                resultDiv.className = 'result show success';
                resultDiv.innerHTML = `
                    <p><span class="badge success">✅ THROTTLING WORKING</span></p>
                    <pre>${results.join('\n')}</pre>
                    <p><em>Rate limiting successfully blocked excessive requests!</em></p>
                `;
            } else {
                resultDiv.className = 'result show success';
                resultDiv.innerHTML = `
                    <p><span class="badge success">✅ ALL PASSED</span></p>
                    <pre>${results.join('\n')}</pre>
                    <p><em>Limit (200/min) not reached - normal usage scenario</em></p>
                `;
            }
        }
    </script>
</body>
</html>
